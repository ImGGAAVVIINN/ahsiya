<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Swipe Video Viewer</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body, html { width: 100%; height: 100%; overflow: hidden; font-family: sans-serif; }
    #overlay {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: #000;
      display: flex; flex-direction: column; align-items: center; justify-content: flex-start;
      color: #fff; overflow: auto; padding: 20px 0;
    }
    
    /* Video grid styles */
    #video-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 10px;
      width: 100%;
      max-width: 900px;
      padding: 15px;
      margin: 0 auto;
    }
    
    .grid-item {
      aspect-ratio: 9/16;
      position: relative;
      overflow: hidden;
      border-radius: 8px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.2);
      cursor: pointer;
      transition: transform 0.3s ease;
      height: 28vh; /* Limit height on large screens */
      max-height: 250px;
      width: 100%; /* Use full width of the grid cell */
    }
    
    .grid-item:hover {
      transform: scale(1.05);
    }
    
    .grid-item video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    
    .grid-item .play-icon {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(0,0,0,0.5);
      border-radius: 50%;
      width: 40px;
      height: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0.7;
    }
    
    .grid-header {
      width: 100%;
      max-width: 900px;
      padding: 10px 15px 20px;
      text-align: center;
      margin: 0 auto;
    }
    
    .loading-indicator {
      text-align: center;
      padding: 20px;
      font-size: 1.2rem;
    }

    #arrow { width: 50px; height: 50px; border-left: 5px solid #fff; border-bottom: 5px solid #fff;
      transform: rotate(-45deg); animation: slide 1s infinite alternate; margin: auto; }
    @keyframes slide { from { transform: translateX(-20px) rotate(-45deg);} to { transform: translateX(20px) rotate(-45deg); } }

    #startBtn { padding: .75rem 1.5rem; background: #1e90ff; border: none; border-radius: .5rem;
      color: #fff; font-size: 1.2rem; cursor: pointer; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }

    #video-container { width: 100%; height: 100%; position: relative; display: none; background: #000; }
    #video-wrapper { width: 100%; height: 100%; overflow: hidden; position: relative; }
    .video-slide { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: contain; }
    .transition { transition: transform 0.5s ease; }

    /* Progress bar styles */
    #progress-container {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 4px;
      background: rgba(255,255,255,0.3);
      z-index: 10;
    }
    #progress-bar {
      width: 0%;
      height: 100%;
      background: #1e90ff;
      transition: width 0.1s linear;
    }

    .controls { position: absolute; bottom: 20px; right: 20px; display: flex; flex-direction: column; gap: 1rem; }
    .controls button { background: rgba(255,255,255,0.2); border: none; padding: .75rem; border-radius: 50%; cursor: pointer; backdrop-filter: blur(5px); }
    
    /* Play/Pause overlay */
    #play-pause-overlay {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(0,0,0,0.5);
      border-radius: 50%;
      width: 80px;
      height: 80px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      opacity: 0;
      transition: opacity 0.3s;
      z-index: 20;
    }
    #play-pause-overlay.visible {
      opacity: 1;
    }
    #play-pause-icon {
      width: 40px;
      height: 40px;
      color: white;
      font-size: 40px;
    }

    /* Share link play overlay */
    #share-play-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.7);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 30;
    }
    
    #share-play-button {
      padding: 15px 30px;
      font-size: 1.5rem;
      background: #1e90ff;
      color: white;
      border: none;
      border-radius: 50px;
      cursor: pointer;
      display: flex;
      align-items: center;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
      transition: transform 0.2s;
    }
    
    #share-play-button:hover {
      transform: scale(1.05);
    }
    
    #share-play-button .play-icon-large {
      margin-right: 10px;
      font-size: 1.8rem;
    }

    /* Media query for narrow screens */
    @media (max-width: 480px) {
      #video-grid {
        gap: 8px; /* Smaller gap on very narrow screens */
      }
      
      .grid-item {
        height: auto; /* Let the aspect ratio control the height */
        max-height: none; /* Remove max-height restriction */
      }
    }
    
    /* Extra small screens */
    @media (max-width: 360px) {
      #video-grid {
        gap: 5px; /* Even smaller gap on extra narrow screens */
      }
    }

    /* Comment overlay styles */
    #comment-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.9);
      display: none;
      flex-direction: column;
      align-items: center;
      z-index: 40;
      color: #fff;
    }
    
    .comment-header {
      width: 100%;
      padding: 15px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid rgba(255,255,255,0.1);
    }
    
    .comment-header h2 {
      font-size: 1.2rem;
    }
    
    .close-comments {
      background: none;
      border: none;
      color: #fff;
      font-size: 1.5rem;
      cursor: pointer;
    }
    
    .comments-container {
      width: 100%;
      max-width: 600px;
      flex: 1;
      overflow-y: auto;
      padding: 15px;
    }
    
    .comment {
      margin-bottom: 15px;
      padding: 12px;
      background: rgba(255,255,255,0.1);
      border-radius: 8px;
    }
    
    .comment-author {
      font-weight: bold;
      margin-bottom: 5px;
      color: #1e90ff;
    }
    
    .comment-form {
      width: 100%;
      max-width: 600px;
      padding: 15px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      border-top: 1px solid rgba(255,255,255,0.1);
    }
    
    .comment-input {
      padding: 12px;
      border-radius: 8px;
      border: none;
      background: rgba(255,255,255,0.1);
      color: white;
      resize: none;
    }
    
    .comment-submit {
      padding: 12px;
      border-radius: 8px;
      border: none;
      background: #1e90ff;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }
    
    .comment-submit:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    
    .no-comments {
      text-align: center;
      padding: 30px;
      color: rgba(255,255,255,0.5);
    }
    
    /* Loading animation for comments */
    .loading-comments {
      text-align: center;
      padding: 30px;
    }
    
    .loading-spinner {
      display: inline-block;
      width: 30px;
      height: 30px;
      border: 3px solid rgba(255,255,255,0.3);
      border-radius: 50%;
      border-top-color: #fff;
      animation: spin 1s ease-in-out infinite;
    }
    
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div id="overlay">
    <div class="grid-header">
      <h1>Select a Video</h1>
    </div>
    <div id="loading" class="loading-indicator">Loading videos...</div>
    <div id="video-grid"></div>
  </div>

  <div id="video-container">
    <div id="video-wrapper"></div>
    <div id="progress-container"><div id="progress-bar"></div></div>
    <div id="play-pause-overlay"  width="100%" height="100%">
      <div id="play-pause-icon" style="height: 55px;">▶</div>
    </div>
    <div id="share-play-overlay" style="display: none;">
      <button id="share-play-button">
        <span class="play-icon-large">▶</span> 
        Play Video
      </button>
    </div>
    <div class="controls">
      <button id="heart">❤</button>
      <button id="comment">💬</button>
      <button id="share">⤴</button>
    </div>
    
    <!-- Comment overlay -->
    <div id="comment-overlay">
      <div class="comment-header">
        <h2>Comments</h2>
        <button class="close-comments">&times;</button>
      </div>
      <div class="comments-container">
        <div class="loading-comments">
          <div class="loading-spinner"></div>
        </div>
      </div>
      <form class="comment-form">
        <textarea class="comment-input" placeholder="Add a comment..." rows="3"></textarea>
        <button type="submit" class="comment-submit">Post Comment</button>
      </form>
    </div>
  </div>

  <script>
    const textUrl = 'https://raw.githubusercontent.com/ImGGAAVVIINN/ahsiya/refs/heads/main/list';
    let allSourceList = []; // Full list of all videos
    let unviewedList = []; // Only videos not viewed
    let sessionHistory = []; // Videos viewed in this session
    let prevStack = [], nextQueue = [], current = null;
    let currentEl;
    let isPlaying = true;
    // Map objects for URL shortening
    let urlToIdMap = {};
    let idToUrlMap = {};
    const playPauseOverlay = document.getElementById('play-pause-overlay');
    const playPauseIcon = document.getElementById('play-pause-icon');
    const videoGrid = document.getElementById('video-grid');
    const loadingIndicator = document.getElementById('loading');
    const overlay = document.getElementById('overlay');
    const videoContainer = document.getElementById('video-container');
    const sharePlayOverlay = document.getElementById('share-play-overlay');
    const sharePlayButton = document.getElementById('share-play-button');
    
    // On page load, initialize session storage and check for hash
    if (!sessionStorage.getItem('sessionVideos')) {
      sessionStorage.setItem('sessionVideos', JSON.stringify([]));
    }
    
    // Check if we have a hash (shared link)
    const hasShareLink = location.hash && location.hash.length > 1;
    
    // Load videos immediately on page load
    loadList().then(() => {
      loadingIndicator.style.display = 'none';
      
      // If we have a share link, directly play that video
      if (hasShareLink && current) {
        startVideoPlayer(current);
      } else {
        // Otherwise create the grid
        createVideoGrid();
      }
    });

    async function loadList() {
      const res = await fetch(textUrl);
      const txt = await res.text();
      allSourceList = txt.split('\n').filter(l => l.trim() && !l.startsWith('//'));

      // Create short ID mappings for all videos
      createShortIdMappings(allSourceList);

      // Get previously viewed videos (from localStorage)
      const viewedVideos = JSON.parse(localStorage.getItem('viewedVideos') || '[]');
      // Get videos viewed in this session
      sessionHistory = JSON.parse(sessionStorage.getItem('sessionVideos') || '[]');

      // Filter out all previously viewed videos
      unviewedList = allSourceList.filter(video => !viewedVideos.includes(video));

      // Check if we have a hash link to a specific video
      if(location.hash) {
        const shortId = decodeURIComponent(location.hash.slice(1));
        const videoUrl = idToUrlMap[shortId];

        if(videoUrl && allSourceList.includes(videoUrl)) {
          current = videoUrl;
          // Remove from unviewed if present
          const unviewedIdx = unviewedList.indexOf(videoUrl);
          if(unviewedIdx !== -1) {
            unviewedList.splice(unviewedIdx, 1);
          }
        }
      }

      // If no hash or invalid hash, leave current as null for grid view
    }

    // Create short IDs for all video URLs
    function createShortIdMappings(videoList) {
      urlToIdMap = {};
      idToUrlMap = {};
      
      videoList.forEach((url, index) => {
        const shortId = generateShortId(url, index);
        urlToIdMap[url] = shortId;
        idToUrlMap[shortId] = url;
      });
    }
    
    // Generate a short, unique ID for a video URL
    function generateShortId(url, index) {
      // Use a simple hash function based on the URL
      let hash = 0;
      for (let i = 0; i < url.length; i++) {
        const char = url.charCodeAt(i);
        hash = ((hash << 5) - hash) + char;
        hash = hash & hash; // Convert to 32bit integer
      }
      
      // Make it positive and combine with index for uniqueness
      hash = Math.abs(hash) + index;
      
      // Convert to base36 for shorter string representation
      return hash.toString(36);
    }

    function startVideoPlayer(videoSrc) {
      // Hide grid overlay and show video container
      overlay.style.display = 'none';
      videoContainer.style.display = 'block';
      
      // Set the selected video as current if not already set
      current = videoSrc;
      
      prevStack = [];
      nextQueue = [];

      const availableVideos = unviewedList.filter(v => v !== videoSrc);

      // Shuffle available videos
      for (let i = availableVideos.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [availableVideos[i], availableVideos[j]] = [availableVideos[j], availableVideos[i]];
      }

      nextQueue = [...availableVideos];

      
      // We no longer add previous videos to prevStack
      // This makes the selected video always be the "first" one
      
      // Mark video as viewed
      markVideoAsViewed(current);
      
      // Set up event listeners for navigation
      addListeners();
      
      // When loading from a share link, we need to show a play button first
      // to satisfy browser autoplay policies that require user interaction
      if (hasShareLink) {
        showSharePlayOverlay();
      } else {
        // Normal flow when coming from grid view (user already interacted)
        showInitial(current);
        updateHash(current);
      }
    }

    function showSharePlayOverlay() {
      // Show the special share play overlay
      sharePlayOverlay.style.display = 'flex';
      
      // Add click event to start playing
      sharePlayButton.addEventListener('click', () => {
        sharePlayOverlay.style.display = 'none';
        showInitial(current);
        updateHash(current);
      }, { once: true });
    }

    function createVideoGrid() {
      // Determine which videos to show (randomized)
      let gridVideos = [];
      
      if (unviewedList.length >= 9) {
        // If we have enough unviewed videos, randomly select 9 from them
        const shuffled = [...unviewedList].sort(() => Math.random() - 0.5);
        gridVideos = shuffled.slice(0, 9);
      } else {
        // Use all unviewed videos
        gridVideos = [...unviewedList];
        
        // Fill the rest with random videos from the full list, avoiding duplicates
        const remainingCount = 9 - unviewedList.length;
        if (remainingCount > 0) {
          // Get videos not already in the grid
          const viewedVideos = allSourceList.filter(v => !unviewedList.includes(v));
          // Shuffle them
          const shuffled = [...viewedVideos].sort(() => Math.random() - 0.5);
          // Add up to the needed amount
          gridVideos.push(...shuffled.slice(0, remainingCount));
        }
      }
      
      // Create grid with the randomized selection
      gridVideos.forEach((videoSrc, index) => {
        const gridItem = document.createElement('div');
        gridItem.className = 'grid-item';
        
        // Create video element for preview
        const videoPreview = document.createElement('video');
        videoPreview.src = videoSrc;
        videoPreview.muted = true;
        videoPreview.loop = true;
        videoPreview.preload = 'metadata';
        videoPreview.playbackRate = 1.5; // Speed up preview
        videoPreview.style.width = '100%';
        videoPreview.style.height = '100%';
        
        // Add play icon overlay
        const playIcon = document.createElement('div');
        playIcon.className = 'play-icon';
        playIcon.innerHTML = '▶';
        
        // Add elements to grid item
        gridItem.appendChild(videoPreview);
        gridItem.appendChild(playIcon);
        
        // Add click handler
        gridItem.addEventListener('click', () => {
          startVideoPlayer(videoSrc);
        });
        
        // Add to grid
        videoGrid.appendChild(gridItem);
        
        // Start playing preview after a delay to avoid overloading browser
        setTimeout(() => {
          videoPreview.play().catch(err => console.log('Preview autoplay failed:', err));
          
          // Pause other videos on hover to improve performance
          gridItem.addEventListener('mouseenter', () => {
            if (videoPreview.paused) videoPreview.play().catch(err => {});
          });
          
          gridItem.addEventListener('mouseleave', () => {
            if (!videoPreview.paused) videoPreview.pause();
          });
        }, index * 200); // Stagger loading
      });
    }

    function markVideoAsViewed(video) {
      // Existing code...
      if (!sessionHistory.includes(video)) {
        sessionHistory.push(video);
        sessionStorage.setItem('sessionVideos', JSON.stringify(sessionHistory));
      }

      const viewedVideos = JSON.parse(localStorage.getItem('viewedVideos') || '[]');
      if (!viewedVideos.includes(video)) {
        viewedVideos.push(video);
        localStorage.setItem('viewedVideos', JSON.stringify(viewedVideos));
      }

      // 💥 Remove from unviewedList
      const index = unviewedList.indexOf(video);
      if (index !== -1) {
        unviewedList.splice(index, 1);
      }
    }

    function createVideoElement(src, preload = false) {
      const vid = document.createElement('video');
      vid.src = src;
      vid.autoplay = !preload;
      vid.loop = true;
      vid.className = 'video-slide';
      if (preload) {
        vid.preload = 'metadata';
        vid.addEventListener('loadeddata', () => vid.pause());
      } else {
        vid.addEventListener('ended', () => vid.play());
      }
      vid.addEventListener('timeupdate', () => updateProgress(vid));
      vid.addEventListener('loadedmetadata', () => updateProgress(vid));
      vid.addEventListener('play', () => updatePlayPauseState(true));
      vid.addEventListener('pause', () => updatePlayPauseState(false));

      return vid;
    }

    function updatePlayPauseState(playing) {
      isPlaying = playing;
      playPauseIcon.textContent = isPlaying ? '❚❚' : '▶';
    }

    function togglePlayPause() {
      if (currentEl) {
        if (isPlaying) {
          currentEl.pause();
        } else {
          currentEl.play();
        }
      }
    }

    function updateProgress(vid) {
      const bar = document.getElementById('progress-bar');
      if(vid.duration) {
        const pct = (vid.currentTime / vid.duration) * 100;
        bar.style.width = pct + '%';
      }
    }

    function showInitial(src) {
      const wrapper = document.getElementById('video-wrapper');
      currentEl = createVideoElement(src);
      currentEl.style.transform = 'translateX(0)';
      wrapper.appendChild(currentEl);

      // Preload videos
      preloadVideos();
    }

    function preloadVideos() {
      const wrapper = document.getElementById('video-wrapper');
      const gapPercent = (40 / window.innerWidth) * 100; // 40px gap in %

      // Remove any existing preloaded videos
      const existingPreloads = wrapper.querySelectorAll('.preloaded-video');
      existingPreloads.forEach(el => wrapper.removeChild(el));

      // Preload up to 2 next videos
      for (let i = 0; i < 2 && i < nextQueue.length; i++) {
        const nextEl = createVideoElement(nextQueue[i], true);
        nextEl.className = `video-slide preloaded-video preloaded-next-${i+1}`;
        nextEl.style.transform = `translateX(${(i+1) * (100 + gapPercent)}%)`;
        wrapper.appendChild(nextEl);
      }

      // Preload up to 2 previous videos
      for (let i = 0; i < 2 && i < prevStack.length; i++) {
        const prevIndex = prevStack.length - 1 - i;
        const prevEl = createVideoElement(prevStack[prevIndex], true);
        prevEl.className = `video-slide preloaded-video preloaded-prev-${i+1}`;
        prevEl.style.transform = `translateX(${-(i+1) * (100 + gapPercent)}%)`;
        wrapper.appendChild(prevEl);
      }
    }

    function updateHash(src) {
      // Use the short ID instead of the full URL
      const shortId = urlToIdMap[src] || generateShortId(src, allSourceList.indexOf(src));
      history.replaceState(null, '', '#' + shortId);
    }

    function isFirstVideo(videoSrc) {
      // Check if the current video is the first in the original list
      return videoSrc === allSourceList[0];
    }

    function swipe(direction) {
      if (direction === 'next') {
        if (nextQueue.length === 0) {
          // 🛠 Generate a fresh random unseen video if available
          const availableVideos = unviewedList.filter(v => v !== current);
          if (availableVideos.length > 0) {
            const randomVideo = availableVideos[Math.floor(Math.random() * availableVideos.length)];
            nextQueue.push(randomVideo);
          } else {
            console.log('No more unseen videos available.');
            return; // Nothing left to swipe
          }
        }

        prevStack.push(current);
        current = nextQueue.shift();
        animateSwipe(1);
        markVideoAsViewed(current); // Mark the new video as viewed
      } else {
        if(prevStack.length === 0 || isFirstVideo(current)) return; // Don't swipe if at first video
        nextQueue.unshift(current);
        current = prevStack.pop();
        animateSwipe(-1);
      }
    }

    let startX = null, currentX = null, isSwiping = false;
    let touchTapDetected = false; // Flag to detect touch taps vs. swipes
    let lastTapTime = 0; // To track touch events

    function addListeners() {
      document.addEventListener('keydown', e => {
        if (e.key === 'ArrowRight') swipe('next');
        if (e.key === 'ArrowLeft') swipe('prev');
        if (e.key === ' ' || e.key === 'k') togglePlayPause(); // Spacebar or K key for play/pause
      });

      const vc = document.getElementById('video-container');
      vc.addEventListener('touchstart', e => {
        // Ignore touchstart if it originates from interaction buttons
        if (e.target.closest('.controls') || e.target.closest('#play-pause-overlay')) return;

        startX = e.changedTouches[0].clientX;
        currentX = startX;
        isSwiping = true;
        touchTapDetected = false; // Reset tap detection
        lastTapTime = Date.now(); // Record touch start time
        
        // Don't pause during touch - wait to see if it's a swipe or tap
        // currentEl.pause(); // Removed to fix Android issue
      });

      vc.addEventListener('touchmove', e => {
        if (!isSwiping) return;
        currentX = e.changedTouches[0].clientX;
        const deltaX = currentX - startX;
        
        // If moved more than 10px horizontally, consider it a swipe not a tap
        if (Math.abs(deltaX) > 10) {
          touchTapDetected = false;
          currentEl.pause(); // Only pause on confirmed swipe
          updateSwipePosition(deltaX);
        }
      });

      vc.addEventListener('touchend', e => {
        if (!isSwiping) return;
        const endX = e.changedTouches[0].clientX;
        const deltaX = endX - startX;
        const touchDuration = Date.now() - lastTapTime;

        // Consider it a tap if movement is minimal and duration is short
        if (Math.abs(deltaX) < 10 && touchDuration < 300) {
          touchTapDetected = true;
          
          // Handle the tap as a play/pause toggle
          if (!e.target.closest('.controls') && e.target.id !== 'play-pause-overlay' && e.target.id !== 'play-pause-icon') {
            showPlayPauseOverlay();
            togglePlayPause();
          }
        } else {
          // Only finalize swipe if it's not a tap
          finalizeSwipe(deltaX);
        }
        
        isSwiping = false;
        startX = null;
        currentX = null;
      });

      // Setup play/pause overlay - modify to prevent double-triggering
      document.getElementById('video-wrapper').addEventListener('click', function(e) {
        // Don't trigger if clicking on controls
        if (e.target.closest('.controls') || e.target.id === 'play-pause-overlay' || e.target.id === 'play-pause-icon') return;
        
        // Prevent handling click events on touch devices when a tap was already handled
        if (touchTapDetected) {
          touchTapDetected = false; // Reset for next interaction
          return;
        }
        
        // Only handle on non-touch devices or when tap wasn't detected
        showPlayPauseOverlay();
        togglePlayPause();
      });

      // Also handle direct clicks on the play/pause overlay
      playPauseOverlay.addEventListener('click', function(e) {
        e.stopPropagation();
        
        // Skip if already handled as a touch
        if (touchTapDetected) {
          touchTapDetected = false;
          return;
        }
        
        togglePlayPause();
      });

      document.getElementById('share').addEventListener('click', async () => {
        const url = location.href;
        if (navigator.share) {
          // Use the native share API on mobile devices
          try {
            await navigator.share({ title: document.title, url });
          } catch (err) {
            console.error('Share failed:', err);
          }
        } else {
          // Fallback to copying the link to the clipboard on PCs
          navigator.clipboard.writeText(url);
          alert('Link copied to clipboard');
        }
      });

      // Add debug sequence detection
      addDebugSequence();

      // Comment button click event
      document.getElementById('comment').addEventListener('click', e => {
        e.stopPropagation();
        showComments();
      });
      
      // Close comments button click event
      closeCommentsBtn.addEventListener('click', () => {
        hideComments();
      });
      
      // Comment form submission
      commentForm.addEventListener('submit', e => {
        e.preventDefault();
        const content = commentInput.value;
        postComment(content);
      });
    }

    function showPlayPauseOverlay() {
      playPauseOverlay.classList.add('visible');
      setTimeout(() => {
        playPauseOverlay.classList.remove('visible');
      }, 1000);
    }

    function addDebugSequence() {
      const sequence = ['share', 'heart', 'comment'];
      let currentStep = 0;

      document.querySelectorAll('.controls button').forEach(button => {
        button.addEventListener('click', e => {
          const id = e.target.id;
          if (id === sequence[currentStep]) {
            currentStep++;
            if (currentStep === sequence.length) {
              showDebugMenu();
              currentStep = 0; // Reset sequence
            }
          } else {
            currentStep = 0; // Reset sequence if the order is broken
          }
        });
      });
    }

    function showDebugMenu() {
      const debugMenu = document.createElement('div');
      debugMenu.style.position = 'fixed';
      debugMenu.style.top = '50%';
      debugMenu.style.left = '50%';
      debugMenu.style.transform = 'translate(-50%, -50%)';
      debugMenu.style.background = '#fff';
      debugMenu.style.color = '#000';
      debugMenu.style.padding = '1rem';
      debugMenu.style.borderRadius = '0.5rem';
      debugMenu.style.boxShadow = '0 4px 6px rgba(0, 0, 0, 0.3)';
      debugMenu.style.zIndex = '1000';

      const message = document.createElement('p');
      message.textContent = 'Debug Menu: Clear Blocked Videos?';

      const clearButton = document.createElement('button');
      clearButton.textContent = 'Clear Blocked Videos';
      clearButton.style.marginTop = '1rem';
      clearButton.style.padding = '0.5rem 1rem';
      clearButton.style.background = '#1e90ff';
      clearButton.style.color = '#fff';
      clearButton.style.border = 'none';
      clearButton.style.borderRadius = '0.5rem';
      clearButton.style.cursor = 'pointer';

      clearButton.addEventListener('click', () => {
        localStorage.removeItem('viewedVideos');
        sessionStorage.removeItem('sessionVideos');
        sessionHistory = [];
        alert('Blocked videos cleared! Reload to see all videos.');
        document.body.removeChild(debugMenu);
      });

      const closeButton = document.createElement('button');
      closeButton.textContent = 'Close';
      closeButton.style.marginTop = '1rem';
      closeButton.style.marginLeft = '1rem';
      closeButton.style.padding = '0.5rem 1rem';
      closeButton.style.background = '#ccc';
      closeButton.style.color = '#000';
      closeButton.style.border = 'none';
      closeButton.style.borderRadius = '0.5rem';
      closeButton.style.cursor = 'pointer';

      closeButton.addEventListener('click', () => {
        document.body.removeChild(debugMenu);
      });

      debugMenu.appendChild(message);
      debugMenu.appendChild(clearButton);
      debugMenu.appendChild(closeButton);
      document.body.appendChild(debugMenu);
    }

    function updateSwipePosition(deltaX) {
      const wrapper = document.getElementById('video-wrapper');
      const offsetPercent = (deltaX / window.innerWidth) * 100;
      const gapPercent = (40 / window.innerWidth) * 100; // 40px gap in %
      
      // If trying to swipe right (previous) at first video, add resistance
      if (deltaX > 0 && isFirstVideo(current)) {
        // Add resistance effect - move only 1/3 the normal distance
        const resistedOffset = offsetPercent / 3;
        currentEl.style.transform = `translateX(${resistedOffset}%)`;
        return; // Don't show or move previous video
      }

      // Update the position of the current video
      currentEl.style.transform = `translateX(${offsetPercent}%)`;

      // Handle the next video
      let nextEl = wrapper.querySelector('.next-slide');
      if (!nextEl && deltaX < 0 && nextQueue.length > 0) {
        nextEl = wrapper.querySelector('.preloaded-next-1') || createVideoElement(nextQueue[0], true);
        nextEl.className = 'video-slide next-slide';
        nextEl.style.transform = `translateX(${100 + gapPercent}%)`;
        if (!wrapper.contains(nextEl)) wrapper.appendChild(nextEl);
      }
      if (nextEl) {
        nextEl.style.transform = `translateX(${100 + gapPercent + offsetPercent}%)`;
      }

      // Handle the previous video - only if not at first video
      let prevEl = wrapper.querySelector('.prev-slide');
      if (!prevEl && deltaX > 0 && prevStack.length > 0 && !isFirstVideo(current)) {
        prevEl = wrapper.querySelector('.preloaded-prev-1') || createVideoElement(prevStack[prevStack.length - 1], true);
        prevEl.className = 'video-slide prev-slide';
        prevEl.style.transform = `translateX(${-100 - gapPercent}%)`;
        if (!wrapper.contains(prevEl)) wrapper.appendChild(prevEl);
      }
      if (prevEl) {
        prevEl.style.transform = `translateX(${-100 - gapPercent + offsetPercent}%)`;
      }

      // Update positions of other preloaded videos
      for (let i = 2; i <= 2; i++) {
        const nextPreload = wrapper.querySelector(`.preloaded-next-${i}`);
        if (nextPreload) {
          nextPreload.style.transform = `translateX(${(i * (100 + gapPercent)) + offsetPercent}%)`;
        }
        
        const prevPreload = wrapper.querySelector(`.preloaded-prev-${i}`);
        if (prevPreload) {
          prevPreload.style.transform = `translateX(${-(i * (100 + gapPercent)) + offsetPercent}%)`;
        }
      }
    }

    function finalizeSwipe(deltaX) {
      const wrapper = document.getElementById('video-wrapper');
      const threshold = window.innerWidth * 0.3; // 30% of screen width
      const offsetPercent = (deltaX / window.innerWidth) * 100;

      if (deltaX < -threshold && nextQueue.length > 0) {
        // Complete swipe to next
        prevStack.push(current);
        current = nextQueue.shift();
        animateSwipeWithTransition(1);
        markVideoAsViewed(current); // Mark the new video as viewed
      } else if (deltaX > threshold && prevStack.length > 0 && !isFirstVideo(current)) {
        // Complete swipe to previous video, but not if at first video
        nextQueue.unshift(current);
        current = prevStack.pop();
        animateSwipeWithTransition(-1);
      } else {
        // Snap back to original position
        animateSnapBack();
      }

      // Clean up temporary elements
      cleanUpTemporarySlides();
    }

    function animateSwipe(dir) {
      const wrapper = document.getElementById('video-wrapper');
      const nextEl = createVideoElement(current);
      const offsetPercent = (40 / window.innerWidth) * 100; // 40px gap in %
      const offset = dir * (100 + offsetPercent);
      nextEl.style.transform = `translateX(${offset}%)`;
      wrapper.appendChild(nextEl);

      void nextEl.offsetWidth;

      currentEl.classList.add('transition');
      nextEl.classList.add('transition');
      currentEl.style.transform = `translateX(${-offset}%)`;
      nextEl.style.transform = 'translateX(0)';

      nextEl.addEventListener('transitionend', () => {
        wrapper.removeChild(currentEl);
        currentEl = nextEl;
        updateHash(current);
        // Preload new videos after swipe is complete
        preloadVideos();
      }, { once: true });
    }

    function animateSwipeWithTransition(dir) {
      const wrapper = document.getElementById('video-wrapper');
      const nextEl = wrapper.querySelector('.next-slide') || wrapper.querySelector('.preloaded-next-1');
      const prevEl = wrapper.querySelector('.prev-slide') || wrapper.querySelector('.preloaded-prev-1');

      if (dir === 1 && nextEl) {
        // Animate to next video
        currentEl.style.transition = 'transform 0.2s ease';
        nextEl.style.transition = 'transform 0.2s ease';
        currentEl.style.transform = `translateX(-100%)`;
        nextEl.style.transform = 'translateX(0)';
        
        // Try to play with robust error handling
        ensureVideoPlays(nextEl);

        // Reset transition after animation
        nextEl.addEventListener('transitionend', () => {
          currentEl.style.transition = '';
          nextEl.style.transition = '';
          
          // Try playing again after transition completes (more reliable)
          ensureVideoPlays(nextEl);
        }, { once: true });

        currentEl = nextEl;
        nextEl.classList.remove('next-slide', 'preloaded-next-1');
      } else if (dir === -1 && prevEl) {
        // Animate to previous video
        currentEl.style.transition = 'transform 0.2s ease';
        prevEl.style.transition = 'transform 0.2s ease';
        currentEl.style.transform = `translateX(100%)`;
        prevEl.style.transform = 'translateX(0)';
        
        // Try to play with robust error handling
        ensureVideoPlays(prevEl);

        // Reset transition after animation
        prevEl.addEventListener('transitionend', () => {
          currentEl.style.transition = '';
          prevEl.style.transition = '';
          
          // Try playing again after transition completes (more reliable)
          ensureVideoPlays(prevEl);
        }, { once: true });

        currentEl = prevEl;
        prevEl.classList.remove('prev-slide', 'preloaded-prev-1');
      }

      updateHash(current);

      // Preload the videos after completing the swipe
      preloadVideos();
    }

    // Helper function to ensure video plays reliably
    function ensureVideoPlays(videoElement) {
      // First attempt to play
      const playPromise = videoElement.play();
      
      // Handle the promise
      if (playPromise !== undefined) {
        playPromise.then(() => {
          // Video started playing successfully
          console.log('Video playback started successfully');
        }).catch(error => {
          console.log('Autoplay prevented:', error);
          
          // If autoplay was prevented, try again after a short delay
          // This can help with mobile browsers that need a moment
          setTimeout(() => {
            videoElement.play().catch(err => {
              console.log('Second play attempt failed:', err);
              
              // Show the play overlay as a last resort if autoplay fails
              if (videoElement === currentEl) {
                showPlayPauseOverlay();
                updatePlayPauseState(false);
              }
            });
          }, 200);
        });
      }
    }

    function animateSnapBack() {
      // Animate snapping back to the current video
      currentEl.style.transition = 'transform 0.2s ease';
      currentEl.style.transform = 'translateX(0)';

      const nextEl = document.querySelector('.next-slide');
      if (nextEl) {
        nextEl.style.transition = 'transform 0.2s ease';
        nextEl.style.transform = 'translateX(100%)';
      }

      const prevEl = document.querySelector('.prev-slide');
      if (prevEl) {
        prevEl.style.transition = 'transform 0.2s ease';
        prevEl.style.transform = 'translateX(-100%)';
      }

      // Reset transition after snapping back
      currentEl.addEventListener('transitionend', () => {
        currentEl.style.transition = '';
        if (nextEl) nextEl.style.transition = '';
        if (prevEl) nextEl.style.transition = '';
      }, { once: true });

      // Try to resume playing with our more robust method
      ensureVideoPlays(currentEl);
    }

    function cleanUpTemporarySlides() {
      const wrapper = document.getElementById('video-wrapper');
      const nextEl = wrapper.querySelector('.next-slide');
      if (nextEl) wrapper.removeChild(nextEl);
      const prevEl = wrapper.querySelector('.prev-slide');
      if (prevEl) wrapper.removeChild(prevEl);
      
      // We don't remove preloaded videos here, as they'll be handled by preloadVideos
    }

    // Comments functionality
    const commentOverlay = document.getElementById('comment-overlay');
    const commentsContainer = document.querySelector('.comments-container');
    const commentForm = document.querySelector('.comment-form');
    const commentInput = document.querySelector('.comment-input');
    const commentSubmitBtn = document.querySelector('.comment-submit');
    const closeCommentsBtn = document.querySelector('.close-comments');
    
    // Store the username to use for comments
    let commentUsername = localStorage.getItem('commentUsername') || generateUsername();
    
    // Generate a random username if none exists
    function generateUsername() {
      const adjectives = ['Happy', 'Clever', 'Swift', 'Bright', 'Gentle', 'Brave', 'Calm'];
      const nouns = ['Panda', 'Tiger', 'Eagle', 'Dolphin', 'Fox', 'Wolf', 'Bear'];
      
      const randomAdj = adjectives[Math.floor(Math.random() * adjectives.length)];
      const randomNoun = nouns[Math.floor(Math.random() * nouns.length)];
      const randomNum = Math.floor(Math.random() * 1000);
      
      const username = `${randomAdj}${randomNoun}${randomNum}`;
      localStorage.setItem('commentUsername', username);
      return username;
    }
    
    // Show comment overlay and load comments
    function showComments() {
      if (!current) return;
      
      commentOverlay.style.display = 'flex';
      loadComments();
    }
    
    // Hide comment overlay
    function hideComments() {
      commentOverlay.style.display = 'none';
    }
    
    // Load comments for the current video
    function loadComments() {
      if (!current) return;
      
      // Show loading state
      commentsContainer.innerHTML = `
        <div class="loading-comments">
          <div class="loading-spinner"></div>
        </div>
      `;
      
      // Load comments from API
      fetch(`http://158.179.31.237:3000/api/comments?videoUrl=${encodeURIComponent(current)}`)
        .then(res => res.json())
        .then(comments => {
          if (comments.length === 0) {
            commentsContainer.innerHTML = `
              <div class="no-comments">
                <p>No comments yet. Be the first to comment!</p>
              </div>
            `;
          } else {
            renderComments(comments);
          }
        })
        .catch(error => {
          console.error('Error loading comments:', error);
          commentsContainer.innerHTML = `
            <div class="no-comments">
              <p>Failed to load comments. Please try again later.</p>
            </div>
          `;
        });
    }
    
    // Render comments to the comments container
    function renderComments(comments) {
      commentsContainer.innerHTML = '';
      
      comments.forEach(comment => {
        const commentElement = document.createElement('div');
        commentElement.className = 'comment';
        commentElement.innerHTML = `
          <div class="comment-author">${escapeHtml(comment.author)}</div>
          <div class="comment-content">${escapeHtml(comment.content)}</div>
        `;
        commentsContainer.appendChild(commentElement);
      });
      
      // Scroll to the bottom to show newest comments
      commentsContainer.scrollTop = commentsContainer.scrollHeight;
    }
    
    // Helper function to escape HTML to prevent XSS
    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }
    
    // Post a new comment
    function postComment(content) {
      if (!content.trim() || !current) return;
      
      // Disable form while posting
      commentInput.disabled = true;
      commentSubmitBtn.disabled = true;
      
      fetch('http://158.179.31.237:3000/api/comments', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          videoUrl: current,
          author: commentUsername,
          content: content
        })
      })
      .then(res => res.json())
      .then(comment => {
        // Add the new comment to the UI
        const commentElement = document.createElement('div');
        commentElement.className = 'comment';
        commentElement.innerHTML = `
          <div class="comment-author">${escapeHtml(comment.author)}</div>
          <div class="comment-content">${escapeHtml(comment.content)}</div>
        `;
        commentsContainer.appendChild(commentElement);
        
        // Scroll to show the new comment
        commentsContainer.scrollTop = commentsContainer.scrollHeight;
        
        // Clear the input field
        commentInput.value = '';
      })
      .catch(error => {
        console.error('Error posting comment:', error);
        alert('Failed to post comment. Please try again.');
      })
      .finally(() => {
        // Re-enable form
        commentInput.disabled = false;
        commentSubmitBtn.disabled = false;
      });
    }
  </script>
</body>
</html>
