<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Swipe Video Player</title>
  <!-- Video.js CSS -->
  <link href="https://vjs.zencdn.net/7.21.0/video-js.css" rel="stylesheet" />
  <!-- Video.js Theme (City Skin) -->
  <link href="https://unpkg.com/videojs-theme-city@1.0.0/dist/videojs-theme-city.css" rel="stylesheet" />
  <!-- FontAwesome for icons -->
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet" />
  <style>
    /* Fullscreen player */
    body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #000; }
    #player-container { position: relative; width: 100%; height: 100%; }
    .video-wrapper { position: absolute; top: 0; left: 0; width: 100%; height: 100%; overflow: hidden; }
    .video-js { width: 100% !important; height: 100% !important; }

    /* Controls (heart, comment, share) */
    #controls { position: absolute; bottom: 20px; right: 20px;
      display: flex; flex-direction: column; gap: 12px; z-index: 5; }
    #controls button {
      background: rgba(0, 0, 0, 0.5);
      border: none;
      border-radius: 50%;
      width: 48px; height: 48px;
      color: #fff;
      font-size: 22px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div id="player-container">
    <div id="current" class="video-wrapper">
      <video
        id="video-player"
        class="video-js vjs-city"
        playsinline
        webkit-playsinline
        controls
      ></video>
    </div>
    <div id="controls">
      <button id="heart"><i class="fa fa-heart"></i></button>
      <button id="comment"><i class="fa fa-comment"></i></button>
      <button id="share"><i class="fa fa-share-alt"></i></button>
    </div>
  </div>

  <!-- Video.js JS -->
  <script src="https://vjs.zencdn.net/7.21.0/video.min.js"></script>
  <script>
    // ====== User Settings ======
    const LIST_URL = 'https://example.com/yourlist.txt'; // <-- Replace with your actual list URL
    // ===========================

    const player = videojs('video-player', { controls: false, autoplay: true });
    let remaining = [];
    let historyStack = [];
    let currentSrc = null;

    // Fetch and parse text file
    fetch(LIST_URL)
      .then(res => res.text())
      .then(text => {
        const lines = text.split(/\r?\n/)
          .filter(line => line.trim() && !line.trim().startsWith('//'));
        remaining = lines;
        playNext();
      })
      .catch(err => console.error('Failed to load list:', err));

    function playNext() {
      if (remaining.length === 0) return;
      const idx = Math.floor(Math.random() * remaining.length);
      const nextSrc = remaining.splice(idx, 1)[0];
      if (currentSrc) historyStack.push(currentSrc);
      animateTransition(nextSrc, 'left');
    }

    function playPrev() {
      if (historyStack.length === 0) return;
      const prevSrc = historyStack.pop();
      animateTransition(prevSrc, 'right');
    }

    function animateTransition(src, direction) {
      const container = document.getElementById('player-container');
      const oldWrapper = document.getElementById('current');

      // Create new wrapper
      const newWrapper = document.createElement('div');
      newWrapper.className = 'video-wrapper';
      const video = document.createElement('video');
      video.className = 'video-js vjs-city';
      video.playsInline = true;
      video.setAttribute('webkit-playsinline', '');
      newWrapper.style.transform = `translateX(${direction === 'left' ? '100%' : '-100%'})`;
      newWrapper.appendChild(video);
      container.insertBefore(newWrapper, oldWrapper);

      // Initialize new player
      const newPlayer = videojs(video, { controls: false, autoplay: true });
      newPlayer.src({ src, type: 'video/mp4' });

      // Animation
      requestAnimationFrame(() => {
        oldWrapper.style.transition = 'transform 0.3s ease';
        newWrapper.style.transition = 'transform 0.3s ease';
        oldWrapper.style.transform = `translateX(${direction === 'left' ? '-100%' : '100%'})`;
        newWrapper.style.transform = 'translateX(0)';
      });

      newWrapper.addEventListener('transitionend', () => {
        // Cleanup old
        player.dispose();
        oldWrapper.remove();
        newWrapper.id = 'current';
        player = newPlayer;
        currentSrc = src;
        updateShareUrl(src);
      }, { once: true });
    }

    // Keyboard controls
    window.addEventListener('keydown', e => {
      if (e.key === 'ArrowLeft') playNext();
      if (e.key === 'ArrowRight') playPrev();
    });

    // Touch controls
    let touchStartX = 0;
    window.addEventListener('touchstart', e => touchStartX = e.changedTouches[0].screenX);
    window.addEventListener('touchend', e => {
      const dx = e.changedTouches[0].screenX - touchStartX;
      if (dx < -50) playNext();
      if (dx > 50) playPrev();
    });

    // Share button updates URL
    function updateShareUrl(src) {
      const url = new URL(window.location);
      url.searchParams.set('video', src);
      window.history.replaceState({}, '', url);
    }
    document.getElementById('share').addEventListener('click', () => {
      navigator.clipboard.writeText(window.location.href)
        .then(() => alert('Link copied!'))
        .catch(() => alert('Failed to copy'));
    });

    // Heart & Comment placeholders
    document.getElementById('heart').addEventListener('click', () => alert('Hearted!'));
    document.getElementById('comment').addEventListener('click', () => alert('Comment!'));
  </script>
</body>
</html>
